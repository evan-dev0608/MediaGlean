name: Publish signed component catalog
on:
  workflow_dispatch:
    inputs:
      release_tags:
        description: Space-separated already published and accepted runtime/parser release tags
        type: string
        required: true
        default: 'worker-0.3.1 python-runtime-1.0.1 media-tools-1.0.1'
      sequence:
        description: Greater than every previously published stable catalog sequence
        type: number
        required: true
permissions:
  contents: read
concurrency:
  group: component-catalog-components-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    environment: engine-release
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Fetch signed metadata from immutable component releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ inputs.release_tags }}
        run: |
          $tags = $env:RELEASE_TAGS.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($tags.Count -lt 1 -or $tags.Count -gt 200) { throw 'Invalid component count' }
          foreach ($tag in $tags) {
            if ($tag -notmatch '^(worker|python-runtime|media-tools)-[A-Za-z0-9][A-Za-z0-9._-]{0,47}$') { throw 'Invalid release tag' }
            $release = gh release view $tag --json isDraft | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $release.isDraft) { throw 'Components must pass acceptance and be published first' }
            gh release download $tag --pattern release.json --pattern release.sig --dir "build/catalog-input/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Signed metadata download failed' }
          }
      - name: Verify components and sign the channel catalog
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SIGNING_KEY_PEM: ${{ secrets.ENGINE_SIGNING_KEY_PEM }}
          CATALOG_SEQUENCE: ${{ inputs.sequence }}
        run: |
          $directories = @(Get-ChildItem build/catalog-input -Directory | ForEach-Object { $_.FullName })
          $previous = @()
          gh release view channel-components-v1 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release download channel-components-v1 --pattern catalog.json --pattern catalog.sig --dir build/previous-catalog
            if ($LASTEXITCODE -ne 0) { throw 'Previous catalog download failed' }
            $previous = @('--previous', 'build/previous-catalog')
          }
          uv run --no-sync python scripts/build_component_catalog.py @directories --output build/catalog --sequence $env:CATALOG_SEQUENCE @previous
          if ($LASTEXITCODE -ne 0) { throw 'Catalog verification/signing failed' }
      - name: Publish fixed channel discovery assets without changing Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view channel-components-v1 --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create channel-components-v1 --target $env:GITHUB_SHA --latest=false --title '[更新渠道] 执行组件' --notes '供应用自动读取的签名更新目录，无需手动下载。安装软件请访问 Releases/latest。ParseHub 官方包独立从 PyPI 获取，本渠道只管理执行组件。'
            if ($LASTEXITCODE -ne 0) { throw 'Channel creation failed' }
          }
          gh release upload channel-components-v1 build/catalog/catalog.json build/catalog/catalog.sig --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Catalog publication failed' }
