name: Build and sign independent execution components
on:
  workflow_dispatch:
    inputs:
      worker_version:
        type: string
        required: true
        default: '0.3.1'
      runtime_version:
        type: string
        required: true
        default: '1.0.1'
      tools_version:
        type: string
        required: true
        default: '1.0.1'
      publish_components:
        description: Space-separated worker python-runtime media-tools; only changed components need release
        type: string
        required: true
        default: 'worker python-runtime media-tools'
      sequence:
        type: number
        required: true
        default: 3
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: execution-components
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - run: uv run --no-sync pytest tests upstream-ParseHub/test -q --tb=short -k "not test_ui_keyboard_themes_and_responsive_layout"
      - name: Build and verify official independent components
        env:
          WORKER_VERSION: ${{ inputs.worker_version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          TOOLS_VERSION: ${{ inputs.tools_version }}
        run: uv run --no-sync python scripts/build_windows.py --stage components --work-dir .local/component-build --worker-version $env:WORKER_VERSION --runtime-version $env:RUNTIME_VERSION --tools-version $env:TOOLS_VERSION
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reviewed-component-bundle
          path: .local/component-build/bundle
          include-hidden-files: true
          retention-days: 7
  sign-drafts:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 20
    environment: engine-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: reviewed-component-bundle
          path: build/component-bundle
      - name: Sign requested component packages
        env:
          ENGINE_SIGNING_KEY_PEM: ${{ secrets.ENGINE_SIGNING_KEY_PEM }}
          ENGINE_KEY_ID: ${{ vars.ENGINE_KEY_ID }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          PUBLISH_COMPONENTS: ${{ inputs.publish_components }}
        run: |
          foreach ($kind in $env:PUBLISH_COMPONENTS.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            if ($kind -notin @('worker','python-runtime','media-tools')) { throw 'Unsupported component' }
            $profile = Get-Content build/component-bundle/profile.json -Raw | ConvertFrom-Json
            $directory = Join-Path build/component-bundle $profile.components.PSObject.Properties[$kind].Value
            $metadata = Get-Content (Join-Path $directory component.json) -Raw | ConvertFrom-Json
            $tag = "$kind-$($metadata.version)"
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/engine.zip"
            uv run --no-sync python scripts/release_engine.py $directory --output "build/signed/$kind" --key-id $env:ENGINE_KEY_ID --sequence $env:RELEASE_SEQUENCE --artifact-url $url --channel stable
            if ($LASTEXITCODE -ne 0) { throw 'Component signing failed' }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: signed-execution-components
          path: build/signed/
          if-no-files-found: error
          retention-days: 7
