name: Build Windows application package draft
on:
  workflow_dispatch:
    inputs:
      worker_version:
        description: Accepted Worker component
        required: true
        type: string
        default: '0.3.1'
      runtime_version:
        description: Accepted Python environment
        required: true
        type: string
        default: '1.0.1'
      tools_version:
        description: Accepted media tool pair
        required: true
        type: string
        default: '1.0.1'
permissions:
  contents: read
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    environment: engine-release
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: native/global.json
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Fetch accepted independent components
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_VERSION: ${{ inputs.worker_version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          TOOLS_VERSION: ${{ inputs.tools_version }}
        run: |
          $versions = @{ 'worker'=$env:WORKER_VERSION; 'python-runtime'=$env:RUNTIME_VERSION; 'media-tools'=$env:TOOLS_VERSION }
          foreach ($kind in $versions.Keys) {
            $tag = "$kind-$($versions[$kind])"
            gh release download $tag --pattern release.json --pattern release.sig --pattern engine.zip --dir "build/component-feeds/$kind"
            if ($LASTEXITCODE -ne 0) { throw 'Component download failed' }
          }
      - run: uv run --no-sync python scripts/materialize_components.py build/component-feeds --output dist/ci/component-bundle
      - name: Build and verify application and separate QA installer
        run: uv run --no-sync python scripts/build_windows.py --stage installer --components dist/ci/component-bundle --work-dir .local/application-build --qa
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: application-package-for-desktop-acceptance
          path: |
            dist/release/*Setup.exe
            dist/release/release.json
            dist/release/qa-release.json
            dist/release/*payload.json
            dist/release/SHA256SUMS.txt
      - name: Create reviewable application draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content dist/release/release.json -Raw | ConvertFrom-Json
          Copy-Item .github/release-application.md build/app-release-notes.md
          gh release create "client-$($release.release)" "dist/release/$($release.installer)" dist/release/SHA256SUMS.txt --target $env:GITHUB_SHA --draft --latest=false --title "媒拾（MediaGlean） $($release.release) · Windows x64" --notes-file build/app-release-notes.md
