[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-downloader-windows"
version = "0.3.0b2"
description = "Windows desktop media downloader with an isolated ParseHub engine"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.8.3", "parsehub[cli]", "cryptography>=49", "packaging>=24"]

[project.scripts]
media-downloader = "media_downloader.app:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14", "pyinstaller>=6,<7"]

[tool.uv.sources]
parsehub = { path = "upstream-ParseHub", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/media_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "upstream-ParseHub/src"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]




